# Upstream part data comes from two third-party services we do not control.
# Every other test in this repo is mocked and offline, which is why the
# suite stayed green for four months while the plugin was completely broken
# in the field (issue #1: upstream retired the data layout the client used).
#
# This job is the tripwire. If it goes red, part sourcing is broken for
# every user — treat it as a production incident, not a flaky test.
name: upstream contract

on:
  schedule:
    # Mondays 06:00 UTC. Weekly is enough: an upstream API shape does not
    # change hourly, and we do not want to hammer a free community mirror.
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    paths:
      - "src/kicad_jlcpcb_mcp/lcsc_client.py"
      - "src/kicad_jlcpcb_mcp/part_library.py"
      - "src/kicad_jlcpcb_mcp/config.py"
      - "tests/test_network_contract.py"
      - ".github/workflows/contract.yml"

permissions:
  contents: read
  issues: write

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Contract tests against live upstream
        env:
          KJLC_NETWORK_TESTS: "1"
        run: pytest tests/test_network_contract.py -v --tb=short

      # The job already requested `issues: write` but never used it, so a
      # weekly failure showed up only as a red tick nobody was watching for.
      # Part sourcing being broken for every user is worth an issue.
      - name: Open an issue if upstream drifted
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v8
        with:
          script: |
            const title = 'Upstream contract tests are failing';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'upstream',
            });
            if (open.some((i) => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['upstream', 'bug'],
              body: [
                'The weekly upstream contract run failed, which means part',
                'sourcing is probably broken for every user — this is how',
                'issue #1 went unnoticed for four months.',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Check whether the response *shape* changed before assuming',
                'the service is merely down.',
              ].join('\n'),
            });
