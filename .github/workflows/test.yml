name: tests

on:
  # Deliberately unfiltered: a fork working on its own branch should get
  # CI too, not silence until it opens a PR against main.
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # The README claims macOS and Windows support, and the plugin now
          # has real per-platform code for both: kicad-cli lives inside the
          # macOS .app bundle and under Program Files on Windows, and the
          # footprint directory differs on all three. None of that was
          # exercised anywhere until this matrix existed. One Python version
          # each is enough — the platform is the variable, not the runtime.
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests (non-KiCad suite)
        run: pytest tests/ --tb=short

      # Reported, not gated. A hard threshold on a suite whose two most
      # important layers (KiCad integration, live upstream) are gated behind
      # env vars would measure the wrong thing, and a number nobody looks at
      # rots. Printing it on every run keeps it visible.
      - name: Coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: pytest tests/ -q --cov=kicad_jlcpcb_mcp --cov-report=term

      # KICAD_INSTALLED=1 integration tests need a KiCad install with the
      # pcbnew Python bindings, which no hosted runner has. Run them locally:
      #   KICAD_INSTALLED=1 pytest tests/
      #
      # Live upstream checks run on their own weekly schedule; see
      # .github/workflows/contract.yml
