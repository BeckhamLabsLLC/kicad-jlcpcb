version: 2
updates:
  # The runtime deps are deliberately bounded (mcp is pinned <2 because the
  # server uses the low-level API that 2.x reorganised). Dependabot will
  # still open PRs for in-range updates and for the bound itself, which is
  # what we want: a visible PR rather than a surprise on someone's fresh
  # install. See CHANGELOG 0.2.1.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    # ruff is pinned in three places that must agree: pyproject.toml,
    # lint.yml and .pre-commit-config.yaml. Dependabot can only bump the
    # first, so its PRs pass CI (lint.yml still runs the old version) while
    # silently desyncing local formatting from CI (#8, #11). Bump all three
    # by hand, in one commit.
    ignore:
      - dependency-name: ruff

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
