[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kicad-jlcpcb"
version = "0.16.0"
description = "MCP server that generates JLCPCB-ready KiCad PCB projects from descriptions, BOMs, or existing KiCad projects"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Alex Beckham", email = "alex@beckhamlabs.com" }
]
keywords = [
    "mcp",
    "claude-code",
    "claude-code-plugin",
    "kicad",
    "jlcpcb",
    "lcsc",
    "pcb",
    "electronics",
    "hardware",
    "gerber",
    "schematic",
    "eda",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # Upper bound is deliberate, not laziness. The server is built on the
    # low-level `mcp.server.Server` API; mcp 2.x removed `Server.list_tools`
    # and renamed `Tool.inputSchema`, so the server fails to start on 2.x
    # with "'Server' object has no attribute 'list_tools'". Without this
    # bound a fresh `pip install -e .` resolves mcp 2.x and the plugin is
    # dead on arrival. Port to the 2.x API before lifting it.
    "mcp>=1.0.0,<2",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/BeckhamLabsLLC/kicad-jlcpcb"
Documentation = "https://github.com/BeckhamLabsLLC/kicad-jlcpcb#readme"
Repository = "https://github.com/BeckhamLabsLLC/kicad-jlcpcb"
Issues = "https://github.com/BeckhamLabsLLC/kicad-jlcpcb/issues"
Changelog = "https://github.com/BeckhamLabsLLC/kicad-jlcpcb/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    # Pinned to the exact version lint.yml and .pre-commit-config.yaml use.
    # An unpinned range meant a local `ruff format` could reformat files
    # that CI then rejected, or vice versa.
    "ruff==0.15.0",
]

[project.scripts]
kicad-jlcpcb = "kicad_jlcpcb_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kicad_jlcpcb_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    # bin/launch.py is what .mcp.json runs; scripts/check_protocol.py is how
    # you tell whether the server actually came up. Neither is importable
    # from the package, so both have to be listed to survive an sdist.
    "/bin",
    "/scripts",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/CODE_OF_CONDUCT.md",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Makes `pytest` work from a clean checkout without PYTHONPATH=src, which
# every doc in this repo previously had to chant.
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"


[tool.coverage.run]
source = ["kicad_jlcpcb_mcp"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
# Lines that only run when an optional dependency or platform is present,
# and are covered by the KICAD_INSTALLED / KJLC_NETWORK_TESTS suites rather
# than the default offline run.
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
